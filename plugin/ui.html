<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Figlog</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #120609; overflow: hidden; }

  #frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  #loading {
    position: fixed;
    inset: 0;
    background: #120609;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
    transition: opacity 0.3s;
  }

  .logo {
    position: relative;
    width: 28px;
    height: 28px;
  }
  .logo-a {
    position: absolute;
    top: 0; left: 0;
    width: 14px; height: 14px;
    background: #ff2d78;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .logo-b {
    position: absolute;
    bottom: 0; right: 0;
    width: 14px; height: 14px;
    background: #ff2d78;
    opacity: 0.6;
    animation: pulse 1.2s ease-in-out infinite 0.6s;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

  p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #7a5060;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet"/>
</head>
<body>

<div id="loading">
  <div class="logo">
    <div class="logo-a"></div>
    <div class="logo-b"></div>
  </div>
  <p id="status">Starting Figlog…</p>
</div>

<iframe
  id="frame"
  src="http://localhost:5173"
  allow="clipboard-read; clipboard-write"
></iframe>

<script>
  const frame   = document.getElementById('frame')
  const loading = document.getElementById('loading')
  const status  = document.getElementById('status')

  // ── Hide loader once the app loads ────────────────────────────────────────
  frame.addEventListener('load', () => {
    loading.style.opacity = '0'
    setTimeout(() => loading.style.display = 'none', 300)
  })

  frame.addEventListener('error', () => {
    status.textContent = 'Could not reach localhost:5173 — is npm run dev running?'
  })

  // ── Forward Figma context into the iframe ─────────────────────────────────
  // Receives messages from code.js and forwards them into the React app
  window.onmessage = (event) => {
    const msg = event.data?.pluginMessage
    if (!msg) return

    // Forward to iframe
    frame.contentWindow?.postMessage({ source: 'figma-plugin', ...msg }, '*')
  }

  // ── Forward messages from the React app back to code.js ──────────────────
  window.addEventListener('message', (event) => {
    // Only relay messages coming FROM the iframe (not from plugin itself)
    if (event.source !== frame.contentWindow) return
    const msg = event.data
    if (!msg || msg.source === 'figma-plugin') return

    // Send to Figma main thread
    parent.postMessage({ pluginMessage: msg }, '*')
  })
</script>
</body>
</html>
