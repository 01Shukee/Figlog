name: Sync Figma Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install connector dependencies
        run: npm install @supabase/supabase-js node-fetch
        working-directory: .

      - name: Run Sync Script
        env:
          VITE_FIGMA_TOKEN: ${{ secrets.VITE_FIGMA_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node connector.mjs
